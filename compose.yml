services:
  db:
    image: postgres
    restart: always
    environment:
      TZ: Asia/Tokyo
      POSTGRES_PASSWORD: password
    volumes:
      - postgresql_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d fe_line_bot_development -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bundle exec rails db:prepare && ./bin/dev"
    tty: true
    stdin_open: true
    volumes:
      - .:/myapp
      - bundle_data:/usr/local/bundle:cached
      - node_modules:/myapp/node_modules
    environment:
      TZ: Asia/Tokyo
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_TOKEN: ${LINE_CHANNEL_TOKEN}
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_ENV: development
      ADMIN_USER: admin
      ADMIN_PASSWORD: 1234
      LIFF_CHANNEL_ID: ${LIFF_CHANNEL_ID} 
      LIFF_ID_SETTINGS: ${LIFF_ID_SETTINGS} 
      LIFF_ID_HISTORY: ${LIFF_ID_HISTORY} 
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec rspec
    volumes:
      - .:/myapp
      - bundle_data:/usr/local/bundle:cached
      - node_modules:/myapp/node_modules
    environment:
      TZ: Asia/Tokyo
      RAILS_ENV: test
      LIFF_CHANNEL_ID: ${LIFF_CHANNEL_ID} 
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_TOKEN: ${LINE_CHANNEL_TOKEN}
    depends_on:
      db:
        condition: service_healthy
volumes:
  bundle_data:
  postgresql_data:
  node_modules:
